services:
  policy-agent:
    build:
      context: .
    image: trust-safety-policy-agent:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      POLICY_DB_PATH: /app/data/chroma
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_BASE: "${LLM_API_BASE:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-60}"
      LLM_REQUIRE_PARAMETERS: "${LLM_REQUIRE_PARAMETERS:-true}"
      LLM_ALLOW_FALLBACKS: "${LLM_ALLOW_FALLBACKS:-false}"
      LLM_PROVIDER_ORDER: "${LLM_PROVIDER_ORDER:-}"
    volumes:
      - policy-chroma:/app/data/chroma
    security_opt:
      - no-new-privileges:true

volumes:
  policy-chroma:

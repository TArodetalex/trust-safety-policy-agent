[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-safety-policy-agent"
version = "0.1.0"
description = "Policy-grounded trust and safety case adjudication and evaluation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "chromadb>=0.5,<2",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trust_safety_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trust-safety-policy-agent"
version = "0.2.0"
description = "Controlled AI decision, evaluation, and MCP lab for trust and safety."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5,<2",
  "mcp>=2,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trust_safety_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
